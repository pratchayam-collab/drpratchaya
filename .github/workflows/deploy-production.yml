# Production deploy: merge to main → D1 migrations → Worker upload.
# There is no Cloudflare Pages project for this site.

name: Deploy production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: "5093b764ea33977e138b71627193ea52"
  # Declared for the whole workflow, not per step. `astro build` needs it too:
  # the Cloudflare Vite plugin opens a remote proxy session during prerender
  # because the AI and Vectorize bindings have no local mode, and that call
  # fails in a non-interactive environment without a token.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloudflare binding types
        # worker-configuration.d.ts is generated, not committed, so a clean
        # checkout has no `Env` bindings and typecheck reports every one of
        # them as missing. `wrangler types` reads wrangler.jsonc only and
        # needs no credentials.
        run: npm run cf-typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply drpratchaya-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy
